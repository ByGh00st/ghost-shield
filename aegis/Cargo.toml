[package]
name = "aegis"
version = "0.2.0"
edition = "2021"

[dependencies]
aya = { git = "https://github.com/aya-rs/aya", rev = "f3b8dd6d4c856753ab6a6db644232f6280d8e8a2" }
aegis-common = { path = "../aegis-common", features = ["user"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
