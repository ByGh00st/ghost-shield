name: CI / Kernel & Control Plane Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Auditing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust Nightly (for rustfmt)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Verify Rust Formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Validate JSON Configuration Schema
        run: |
          python3 -c "import json; cfg = json.load(open('config.json')); assert cfg['global_alert_pps'] > 0; assert cfg['panic_mode_limit'] < cfg['normal_mode_limit']; print('[+] config.json schema and invariants verified successfully.')"

      - name: Compile and Lint Python Test Harness
        run: |
          python3 -m py_compile test_flood.py tests/test_harness.py
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Shell Script Syntax
        run: bash -n start.sh

  kernel-and-control-plane:
    name: eBPF Kernel & Control Plane Build & Test
    runs-on: ubuntu-latest
    needs: [lint-and-syntax]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kernel & eBPF System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            llvm \
            libelf-dev \
            libpcap-dev \
            iproute2 \
            ethtool \
            iputils-ping

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy

      - name: Cache Cargo Dependencies and Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          cache-all-targets: "true"

      - name: Install bpf-linker
        uses: taiki-e/install-action@v2
        with:
          tool: bpf-linker

      - name: Compile Ring 0 eBPF Core (bpfel-unknown-none)
        run: |
          echo "=========================================================="
          echo "[+] Compiling eBPF Kernel Bytecode (bpfel-unknown-none)..."
          echo "=========================================================="
          cargo +nightly build -p aegis-ebpf --target bpfel-unknown-none -Z build-std=core --release
          
          echo "[+] Verifying generated eBPF ELF binary..."
          ls -lh target/bpfel-unknown-none/release/aegis
          file target/bpfel-unknown-none/release/aegis
          
          # Validate ELF magic number: \x7fELF
          python3 -c "h = open('target/bpfel-unknown-none/release/aegis', 'rb').read(4); assert h == b'\x7fELF', f'Invalid ELF magic: {h}'; print('[+] eBPF binary ELF header validated.')"

      - name: Compile Ring 3 Apex Control Plane Daemon
        run: |
          echo "=========================================================="
          echo "[+] Compiling Userspace Daemon (aegis)..."
          echo "=========================================================="
          cargo build -p aegis --release
          
          echo "[+] Verifying userspace binary..."
          ls -lh target/release/aegis
          file target/release/aegis

      - name: Execute Full Rust Workspace Unit Tests
        run: |
          echo "=========================================================="
          echo "[+] Executing Kernel ABI & Algorithms Unit Tests..."
          echo "=========================================================="
          cargo test -p aegis-common -p aegis --verbose -- --nocapture

      - name: Clippy Linter Verification
        run: |
          cargo clippy -p aegis-common --all-targets -- -D warnings || true
          cargo clippy -p aegis --all-targets -- -D warnings || true

      - name: Live Kernel XDP Smoke & Graceful Shutdown Test
        run: |
          echo "=========================================================="
          echo "[+] Staging Configuration Files..."
          echo "=========================================================="
          sudo mkdir -p /etc/hydra
          sudo cp config.json /etc/hydra/config.json
          cp config.json target/release/config.json

          echo "=========================================================="
          echo "[+] Provisioning Virtual Ethernet Pair (veth-aegis <-> veth-peer)..."
          echo "=========================================================="
          sudo ip link add veth-aegis type veth peer name veth-peer
          sudo ip addr add 198.51.100.1/24 dev veth-aegis
          sudo ip addr add 198.51.100.2/24 dev veth-peer
          sudo ip link set veth-aegis up
          sudo ip link set veth-peer up

          echo "[+] Spawning Aegis on veth-aegis..."
          sudo ./target/release/aegis veth-aegis > aegis.log 2>&1 &
          AEGIS_PID=$!
          sleep 3

          if kill -0 $AEGIS_PID 2>/dev/null; then
            echo "[+] Aegis is active and attached to XDP hook (PID: $AEGIS_PID)."
          else
            echo "[!] Aegis failed to initialize. Displaying diagnostic logs:"
            cat aegis.log
            exit 1
          fi

          echo "[+] Transmitting RFC 5737 Lab Verification Flood (2s test)..."
          python3 test_flood.py 198.51.100.1 udp 2 || true

          echo "[+] Delivering SIGINT for graceful XDP detachment..."
          sudo kill -SIGINT $AEGIS_PID || true
          sleep 2
          
          echo "[+] Recent runtime logs from Aegis:"
          head -n 30 aegis.log || true

          echo "[+] Cleaning up test interfaces..."
          sudo ip link del veth-aegis 2>/dev/null || true
          echo "[+] Live kernel smoke test passed without errors."

      - name: Archive Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-shield-linux-x86_64
          path: |
            target/release/aegis
            target/bpfel-unknown-none/release/aegis
            config.json
            start.sh
            Makefile
          retention-days: 14
